<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/solo_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Reached only by scanning the printed card; keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>15% զեղչ քարտապանների համար — Solo Beauty</title>
    <!-- Fallback Armenian glyphs for devices whose system font lacks them.
         Google Fonts serves this with unicode-range, so it only downloads
         when the system font can't render Armenian itself. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@200..700&display=swap" rel="stylesheet" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DWHP6DVX2S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DWHP6DVX2S');
      // The printed QR code links to
      //   /card/?utm_source=qr&utm_medium=print&utm_campaign=bonus_card
      // GA files those visits under source "qr"; this event counts each scan
      // on its own so it can be marked as a key event in GA.
      if (new URLSearchParams(location.search).get('utm_source') === 'qr') {
        gtag('event', 'qr_scan', { campaign: 'bonus_card' });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/card/main.jsx"></script>
  </body>
</html>
